# Portainer: Stacks -> Add stack -> Repository, then set the variables below under
# "Environment variables". Nothing secret is committed to the repo.
services:
  relay:
    build:
      context: .
    image: stbplayer-relay:latest
    container_name: stbplayer-relay
    restart: unless-stopped

    ports:
      # The dashboard, and the shared Xtream endpoint where a line is addressed by its MAC.
      - "${RELAY_PORT:-4700}:4700"
      # Ports a line can claim for itself. The whole range is published up front because a line's
      # port is chosen later in the dashboard, and Docker cannot add a published port to a running
      # container — without this you would have to redeploy the stack to give a line its own port.
      - "${RELAY_PORT_RANGE:-4701-4720}:4701-4720"

    environment:
      # Password for the dashboard. Leave it unset and the relay generates one and prints it to the
      # container log on first start; setting it here is how you recover from a forgotten password.
      RELAY_ADMIN_PASSWORD: "${RELAY_ADMIN_PASSWORD:-}"

      # Lines are managed in the dashboard, not here. These three are read ONCE, on a first run
      # with no configuration, to import an existing single-line setup — after that they're ignored.
      RELAY_PORTAL: "${RELAY_PORTAL:-}"
      RELAY_MAC: "${RELAY_MAC:-}"
      RELAY_PASSWORD: "${RELAY_PASSWORD:-}"

      # Must match the published range above, or a line could claim a port nothing can reach.
      RELAY_PORT_MIN: "${RELAY_PORT_MIN:-4701}"
      RELAY_PORT_MAX: "${RELAY_PORT_MAX:-4720}"

      RELAY_TZ: "${RELAY_TZ:-Europe/London}"

      # Node heap ceiling. A very large line (100k+ catalogue items) holds the whole listing in
      # memory and can exceed Node's ~2GB default while warming. Raise for huge lines / many lines.
      NODE_OPTIONS: "${RELAY_NODE_OPTIONS:---max-old-space-size=4096}"

    volumes:
      # Holds config.json (your lines) and relay-state.json (stream ids). Losing this means
      # re-adding every line, and every saved favourite in every player pointing somewhere new.
      - relay_data:/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4700/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  relay_data:
