name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies, so nothing to install.
      - name: Syntax check
        run: for f in *.js; do node --check "$f"; done

      - name: Relay tests
        run: node test-relay.js

      - name: Dashboard and port tests
        run: node test-dashboard.js

      - name: Catalogue tests
        run: node test-catalog.js

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: test
    # Pull requests must not publish; only the real branch produces an image.
    if: github.event_name == 'push'

    permissions:
      contents: read
      # Lets GITHUB_TOKEN push to this repo's package. No secrets to configure.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Lowercase is required: GHCR rejects capitals in a repository name, and GitHub
          # usernames may contain them.
          tags: |
            ghcr.io/${{ github.repository_owner }}/stalkerrelay:latest
            ghcr.io/${{ github.repository_owner }}/stalkerrelay:${{ github.sha }}
          # arm64 as well, so this runs on a Pi or a NAS without changes.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Where it went
        run: |
          echo "Image: ghcr.io/${{ github.repository_owner }}/stalkerrelay:latest"
          echo "Make the package public once, under the repo's Packages tab, or Portainer"
          echo "will need registry credentials to pull it."
